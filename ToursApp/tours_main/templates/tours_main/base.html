{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Главная страница{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'tours_main/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'tours_main/css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'tours_main/css/promo.css' %}">
    <link rel="stylesheet" href="{% static 'tours_main/css/destinations.css' %}">
    <link rel="stylesheet" href="{% static 'tours_main/css/tours_page.css' %}">
    <link rel="stylesheet" href="{% static 'tours_main/css/about.css' %}">
    
    <link rel="icon"
      type="image/png"
      href="{% static 'tours_main/img/favicon.png' %}">

</head>
<body>

    <!-- ===========================
            HEADER
    ============================ -->

    <header class="header">

        <div class="header-container">

            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'tours_main/img/logo.png' %}" alt="Кругосвет">
            </a>

            <nav class="nav">
                <a href="{% url 'home' %}" class="active">Главная</a>
                <a href="{% url 'tours' %}">Туры</a>
                <a href="#">Акции</a>
                <a href="{% url 'about' %}">О нас</a>
            </nav>

            <a href="/login/" class="tour-btn">

                Войти

                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                        stroke="white"
                        stroke-width="2"/>

                    <path
                        d="M5 20C5 16.7 7.7 14 11 14H13C16.3 14 19 16.7 19 20"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"/>

                </svg>

            </a>

        </div>

    </header>
    <div class="page">
        <!-- Lenis Smooth Scroll -->
<script src="https://unpkg.com/lenis@1.3.1/dist/lenis.min.js"></script>

<script>
const lenis = new Lenis({
    duration: 1.4,
    smoothWheel: true,
    wheelMultiplier: 1,
    touchMultiplier: 2,
});

function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
}

requestAnimationFrame(raf);
</script>
    {% block content %}

    {% endblock %}

</div>
</body>
</html>
